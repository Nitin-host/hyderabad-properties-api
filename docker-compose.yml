services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      VIDEO_PROCESS_IN_API: "false"

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.video
    ports:
      - "5100:5100"
    env_file:
      - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      VIDEO_WORKER_PORT: "5100"
